name: Release API

on:
  push:
    tags:
      - 'api/v*'

permissions:
  contents: write   # create GitHub Release
  packages: write   # push image to GHCR

concurrency:
  group: release-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, publish backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches backend/VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/api/v}"
          FILE="$(tr -d '[:space:]' < backend/VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Git tag api/v$TAG does not match backend/VERSION ($FILE). Bump backend/VERSION or retag."
            exit 1
          fi
          echo "API_VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint backend
        run: make lint-backend

      - name: Unit tests
        run: make test-backend

      - name: Integration tests
        run: make test-backend-integration

      - name: Regenerate OpenAPI spec (release asset)
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@latest
          make swag

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/budget-backend
          # Extract X.Y.Z and X.Y from a tag like `api/v1.15.0`.
          # No `latest` — per project convention pinned deploys avoid floating tags.
          tags: |
            type=match,pattern=api/v(.*),group=1
            type=match,pattern=api/v(\d+\.\d+)\.\d+,group=1
          labels: |
            org.opencontainers.image.version=${{ env.API_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_VERSION=${{ env.API_VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: API v${{ env.API_VERSION }}
          generate_release_notes: true
          make_latest: 'false'
          files: |
            backend/docs/swagger.json
            backend/docs/swagger.yaml
