name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  # Manual override for the path-filter gating below — when fired from
  # the Actions tab («Run workflow») all three component jobs run
  # regardless of which files changed. Mirrors GitLab's behaviour where
  # web-UI runs ignore `rules:changes`. Useful for flaky-test re-runs or
  # forcing a clean re-execution on the current ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    # `workflow_dispatch` short-circuits each output to `true` so the
    # downstream `if: needs.changes.outputs.<x> == 'true'` gates open
    # regardless of which paths changed. Push/PR events still go through
    # `dorny/paths-filter` so unrelated changes don't burn all three legs.
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      web:     ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      bot:     ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.bot == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'tools/build-android-release.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            bot:
              - 'telegram_bot/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  # Job display names are kept short and ASCII-only so they can be filtered
  # in shields.io badge URLs via `?jobName=...` without heavy URL-encoding.

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-go's `go-version-file` reads only the `go` directive and ignores
      # `toolchain`, so we end up with go1.25.0 while go.mod pins toolchain
      # go1.25.9 → `compile: version mismatch` at test time. Parse the
      # toolchain directive explicitly and pin to it.
      - name: Resolve Go version from go.mod toolchain directive
        id: gover
        run: |
          ver=$(awk '/^toolchain go/ {sub(/^go/,"",$2); print $2; exit}' backend/go.mod)
          [ -z "$ver" ] && ver=$(awk '/^go / {print $2; exit}' backend/go.mod)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Using Go $ver"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint (gofmt + go vet + golangci-lint)
        run: make lint-backend

      - name: Unit tests (with coverage)
        run: make test-backend-cover

      - name: Integration tests (testcontainers + MongoDB)
        run: make test-backend-integration

      - name: Swagger drift check
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@latest
          make swag
          if ! git diff --exit-code backend/docs/swagger.json backend/docs/swagger.yaml; then
            echo "::error::OpenAPI spec out of date — run 'make swag' locally and commit the diff"
            exit 1
          fi

      - name: Generate coverage badge JSON
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: ./tools/coverage-badge.sh backend backend/coverage.out

      - name: Upload coverage badge artifact
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: badge-backend
          path: _badges/backend.json
          retention-days: 1

  web:
    name: Web
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No `cache: 'yarn'` — setup-node would call `yarn cache dir` via the
          # runner's global yarn 1.x, which refuses to run in a project that
          # pins `packageManager: yarn@4` (Corepack-only). Enable Corepack
          # manually below.

      - name: Enable Corepack (pin Yarn 4 from packageManager)
        run: corepack enable

      - name: Install
        working-directory: frontend
        run: corepack yarn install --immutable

      - name: Lint (ESLint)
        working-directory: frontend
        run: corepack yarn lint

      - name: Format check (Prettier)
        working-directory: frontend
        run: corepack yarn format:check

      - name: Test (Vitest with coverage)
        run: make test-web-cover

      - name: Generate coverage badge JSON
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: ./tools/coverage-badge.sh web frontend/coverage/lcov.info

      - name: Upload coverage badge artifact
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: badge-web
          path: _badges/web.json
          retention-days: 1

  android:
    name: Android
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 (preview channel)
        run: |
          set -euo pipefail
          # Runner's pre-installed cmdline-tools may have a stale package
          # index that doesn't yet list API 37 — install `cmdline-tools;latest`
          # side-by-side and use that fresher sdkmanager.
          sdkmanager --install 'cmdline-tools;latest' >/dev/null
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses --channel=3 >/dev/null 2>&1 || true
          # Google publishes preview platforms with a minor suffix
          # (`android-37.0`, not `android-37`) until API finalisation.
          "$SDKMGR" --channel=3 'platforms;android-37.0'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Stub android/local.env (Makefile sources it; SOCKS proxy unused in CI)
        run: touch android/local.env

      - name: Lint (ktlint + detekt)
        run: make lint-android

      - name: Unit tests + JaCoCo coverage
        run: make test-android-cover

      - name: Generate coverage badge JSON
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: ./tools/coverage-badge.sh android android/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload coverage badge artifact
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: badge-android
          path: _badges/android.json
          retention-days: 1

  bot:
    name: Bot
    needs: changes
    if: ${{ needs.changes.outputs.bot == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev deps
        working-directory: telegram_bot
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        working-directory: telegram_bot
        run: ruff check src

      # No unit tests yet — placeholder so the job stays meaningful as the
      # bot grows. Once `tests/` lands, swap to `pytest`.

  # ─── Build verification (only on push to main/develop) ────────────────────
  # Validates that production Dockerfiles / Gradle release path still produce
  # an image / APK after merge, before anyone cuts a release tag. Skipped on
  # PRs to keep PR feedback fast — the release-* workflows will catch any
  # build break that slips through.

  backend-build:
    name: Backend build
    needs: [changes, backend]
    if: ${{ needs.changes.outputs.backend == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          tags: budget-backend:ci-${{ github.sha }}
          build-args: |
            API_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  web-build:
    name: Web build
    needs: [changes, web]
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: budget-frontend:ci-${{ github.sha }}
          build-args: |
            WEB_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  android-build:
    name: Android build
    needs: [changes, android]
    if: ${{ needs.changes.outputs.android == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37 (preview channel)
        run: |
          set -euo pipefail
          sdkmanager --install 'cmdline-tools;latest' >/dev/null
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses --channel=3 >/dev/null 2>&1 || true
          "$SDKMGR" --channel=3 'platforms;android-37.0'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - name: Stub android/local.env
        run: touch android/local.env
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon :app:assembleDebug

  bot-build:
    name: Bot build
    needs: [changes, bot]
    if: ${{ needs.changes.outputs.bot == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build telegram-bot image (no push, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: telegram_bot
          file: telegram_bot/Dockerfile
          push: false
          # arm64 leg is left to the release workflow — cross-builds of
          # faster-whisper/ctranslate2 via QEMU are slow (~10-20 min) and
          # would balloon PR-feedback time. amd64-only is enough to catch
          # `pip install` and import-time breakages on every push.
          platforms: linux/amd64
          tags: budget-telegram-bot:ci-${{ github.sha }}
          build-args: |
            BOT_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  # ─── Publish coverage badges to the `badges` orphan branch ────────────────
  # Single consolidated job: avoids three component jobs racing for `git push`.
  # README references SVGs rendered by shields.io from raw.githubusercontent.com
  # — self-hosted, no Codecov / no external services beyond shields.io itself.

  publish-coverage-badges:
    name: Publish coverage badges
    needs: [backend, web, android]
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect badge artifacts
        uses: actions/download-artifact@v4
        with:
          path: _badges
          pattern: badge-*
          merge-multiple: true

      - name: Show collected badges
        run: ls -la _badges/ 2>/dev/null || echo "no badge artifacts (path-filtered out)"

      - name: Publish to `badges` orphan branch
        if: hashFiles('_badges/*.json') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_badges
          publish_branch: badges
          keep_files: true
          commit_message: 'ci(badges): coverage update (${{ github.sha }})'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
