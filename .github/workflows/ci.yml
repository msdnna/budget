name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web:     ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'tools/build-android-release.sh'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Go) — lint + test
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint (gofmt + go vet + golangci-lint)
        run: make lint-backend

      - name: Unit tests
        run: make test-backend

      - name: Integration tests (testcontainers + MongoDB)
        run: make test-backend-integration

      - name: Swagger drift check
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@latest
          make swag
          if ! git diff --exit-code backend/docs/swagger.json backend/docs/swagger.yaml; then
            echo "::error::OpenAPI spec out of date — run 'make swag' locally and commit the diff"
            exit 1
          fi

  web:
    name: Web (Vue 3) — lint + test
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack (pin Yarn 4 from packageManager)
        run: corepack enable

      - name: Install
        working-directory: frontend
        run: corepack yarn install --immutable

      - name: Lint (ESLint)
        working-directory: frontend
        run: corepack yarn lint

      - name: Format check (Prettier)
        working-directory: frontend
        run: corepack yarn format:check

      - name: Test (Vitest)
        working-directory: frontend
        run: corepack yarn test

  android:
    name: Android (Kotlin/Compose) — lint + test
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Stub android/local.env (Makefile sources it; SOCKS proxy unused in CI)
        run: touch android/local.env

      - name: Lint (ktlint + detekt)
        run: make lint-android

      - name: Unit tests (JUnit 4 + Robolectric + MockWebServer)
        run: make test-android
