server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version banner.
    server_tokens off;

    # Baseline security headers. CSP intentionally omitted here — Swagger UI
    # (when locally enabled) loads from jsdelivr and ECharts uses inline
    # styles; add CSP at the external reverse-proxy once prod hostnames are
    # fixed. X-Frame-Options blocks clickjacking, nosniff prevents MIME
    # confusion, Referrer-Policy stops leakage to third-parties.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Self-distributed APKs for in-app updates. Files are mounted from the host
    # (./apks) — must return a hard 404 when missing, never the SPA fallback.
    location /apks/ {
        alias /usr/share/nginx/html/apks/;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=3600";
        # Re-declare security headers — nginx replaces (not merges) inherited
        # add_header when any add_header is set inside a location.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
