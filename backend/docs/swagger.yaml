  /sync/pull:
    get:
      description: Возвращает все записи трёх syncable-коллекций (transactions, wishlist,
        categories), включая soft-deleted. Первый вызов без `since` отдаёт полный
        набор без удалённых.
      parameters:
      - description: RFC3339(Nano) timestamp
        in: query
        name: since
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SyncPullResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: 'Pull-фаза синка: всё, что менялось после `since`'
      tags:
      - sync
  /sync/push:
    post:
      description: Каждая операция независима; результат на операцию позволяет клиенту
        пометить, что синканулось, а что — конфликт. `force=true` обходит version-check.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.SyncPushRequest'
