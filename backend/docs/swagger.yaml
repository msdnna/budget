          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Пометить одно уведомление прочитанным
      tags:
      - notifications
  /notifications/read-all:
    post:
      description: Добавляет user_id в `read_by` каждого уведомления, где его ещё
        нет.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Пометить все уведомления прочитанными
      tags:
      - notifications
  /statistics/by-category:
    get:
      description: Сумма, доля и количество транзакций в разрезе категории. По умолчанию
        `type=expense`.
      parameters:
      - description: income|expense|initial_balance
        in: query
        name: type
        schema:
          default: expense
          type: string
      - description: YYYY-MM-DD
        in: query
        name: from
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: YYYY-MM
        in: query
        name: month
        schema:
          type: string
      - description: YYYY
        in: query
        name: year
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.CategoryData'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Агрегация по категориям
      tags:
      - statistics
  /statistics/forecast:
    get:
      description: Историческое среднее (3 мес, без транзакций, связанных с wishlist)
        + вклад регулярных wishlist-итемов по next-due модели. Возвращает per-item
        breakdown с `paid_this_period` для UI-бейджей.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ForecastResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Прогноз расходов на месяц
      tags:
      - statistics
  /statistics/monthly:
    get:
      description: Возвращает массив `{year, month, income, expense, balance}` по
        месяцам. Если задан только `month`, диапазон расширяется до полного года ради
        контекста на графике.
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: from
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: YYYY-MM
        in: query
        name: month
        schema:
          type: string
      - description: YYYY
        in: query
        name: year
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.MonthlyData'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Помесячная динамика
      tags:
      - statistics
  /statistics/overview:
    get:
      description: Объединённый ответ для экрана статистики Android, чтобы не делать
        4 последовательных запроса. Подзапросы выполняются параллельно.
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: from
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: YYYY-MM
        in: query
        name: month
        schema:
          type: string
      - description: YYYY
        in: query
        name: year
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.StatisticsOverviewResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Сводка + by-category(expense/income) + monthly за один запрос
      tags:
      - statistics
  /statistics/summary:
    get:
      description: Итоговые суммы доходов / расходов / баланса. Период задаётся `from`+`to`,
        либо `month=YYYY-MM`, либо `year=YYYY` (последний выигрывает).
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: from
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: YYYY-MM
        in: query
        name: month
        schema:
          type: string
      - description: YYYY
        in: query
        name: year
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SummaryData'
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Сводка за период
      tags:
      - statistics
  /sync/pull:
    get:
      description: Возвращает все записи трёх syncable-коллекций (transactions, wishlist,
        categories), включая soft-deleted. Первый вызов без `since` отдаёт полный
        набор без удалённых.
      parameters:
      - description: RFC3339(Nano) timestamp
        in: query
        name: since
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SyncPullResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: 'Pull-фаза синка: всё, что менялось после `since`'
      tags:
      - sync
  /sync/push:
    post:
      description: Каждая операция независима; результат на операцию позволяет клиенту
        пометить, что синканулось, а что — конфликт. `force=true` обходит version-check.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.SyncPushRequest'
                description: Батч операций
                summary: body
        description: Батч операций
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.SyncPushResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: 'Push-фаза синка: батч клиентских мутаций'
      tags:
      - sync
  /transactions:
    get:
      description: Фильтры комбинируются по И. `categories` — список через запятую
        (приоритетнее `category`). `include_detailed=true` показывает родителей закрытых
        detail-requests.
      parameters:
      - description: income|expense|initial_balance
        in: query
        name: type
        schema:
          type: string
      - description: Имя категории
        in: query
        name: category
        schema:
          type: string
      - description: CSV категорий
        in: query
        name: categories
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: from
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: Страница (1-based)
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Размер страницы (1-100)
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      - description: Показывать родителей закрытых detail-requests
        in: query
        name: include_detailed
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Список транзакций с пагинацией
      tags:
      - transactions
    post:
      description: Создаёт доход / расход / начальный баланс. `date` принимается в
        формате YYYY-MM-DD.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.CreateTransactionRequest'
                description: Тело
                summary: body
        description: Тело
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Transaction'
          description: Created
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Создать транзакцию
      tags:
      - transactions
  /transactions/{id}:
    delete:
      description: Запись помечается `deleted_at`; синк-клиенты увидят её при следующем
        pull.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Удалить транзакцию (soft-delete)
      tags:
      - transactions
    put:
      description: Patch-семантика — пустые поля игнорируются, кроме `wishlist_id`
        (пустая строка отвязывает от wishlist-итема).
      parameters:
      - description: Transaction ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.UpdateTransactionRequest'
                description: Поля для обновления
                summary: body
        description: Поля для обновления
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Transaction'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Обновить транзакцию
      tags:
      - transactions
  /users:
    get:
      description: Усечённая публичная информация — без password_hash и email.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.UserInfo'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Список пользователей семьи
      tags:
      - auth
  /users/{id}/avatar:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/png:
              schema:
                type: file
          description: OK
      security:
      - BearerAuth: []
      summary: Отдать аватар пользователя (raw bytes)
      tags:
      - users
  /version:
    get:
      description: Публичный эндпоинт. `android_latest` / `android_min_required` берутся
        из env-переменных бэкенда — клиент-обновление и gate-проверка.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: 'Версии: API + последняя/минимальная Android'
      tags:
      - meta
  /wishlist:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.WishlistItem'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Все wishlist-итемы (без soft-deleted)
      tags:
      - wishlist
    post:
      description: '`frequency=once` — обычная покупка из списка желаний. `monthly|quarterly|yearly`
        — регулярный платёж (коммуналка, связь и т.п.).'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.CreateWishlistRequest'
                description: Тело
                summary: body
        description: Тело
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.WishlistItem'
          description: Created
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Создать wishlist-итем (одноразовый или регулярный)
      tags:
      - wishlist
  /wishlist/{id}:
    delete:
      parameters:
      - description: Wishlist ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Удалить wishlist-итем (soft-delete)
      tags:
      - wishlist
    put:
      description: Patch-семантика. `purchased=true` помечает «куплено» (используется
        UI-кнопкой); транзакция списания создаётся отдельным `POST /transactions`.
      parameters:
      - description: Wishlist ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.UpdateWishlistRequest'
                description: Поля
                summary: body
        description: Поля
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.WishlistItem'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Обновить wishlist-итем
      tags:
      - wishlist
  /wishlist/{id}/link/{tx_id}:
    post:
      description: Фиксирует существующую транзакцию как оплату/покупку. Категория
        транзакции приводится к категории wishlist-итема; недостающая категория клонируется
        в expense с цветом/иконкой. `once`-итемы дополнительно помечаются `purchased=true`.
      parameters:
      - description: Wishlist ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Transaction ID
        in: path
        name: tx_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.Transaction'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Транзакция уже связана
      security:
      - BearerAuth: []
      summary: Привязать существующий расход к wishlist/regular-итему
      tags:
      - wishlist
  /wishlist/{id}/unlink-period:
    post:
      description: Очищает `wishlist_id` у транзакций в текущем месяце/квартале/году
        (по `frequency`). Для `once` — отвязывает единственную привязанную транзакцию
        без date-filter. Бэкенд для кнопок «Не куплено» и «Отменить».
      parameters:
      - description: Wishlist ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
      security:
      - BearerAuth: []
      summary: Отвязать транзакции wishlist-итема за текущий период
      tags:
      - wishlist
servers:
- url: /api
