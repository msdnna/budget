    post:
      description: Создаёт доход / расход / начальный баланс. `date` принимается в
        формате YYYY-MM-DD.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.CreateTransactionRequest'
