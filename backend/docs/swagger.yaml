        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: 'Push-фаза синка: батч клиентских мутаций'
      tags:
      - sync
  /transactions:
    get:
      description: Фильтры комбинируются по И. `categories` — список через запятую
        (приоритетнее `category`). `include_detailed=true` показывает родителей закрытых
        detail-requests.
      parameters:
      - description: income|expense|initial_balance
        in: query
        name: type
        schema:
          type: string
      - description: Имя категории
        in: query
        name: category
        schema:
          type: string
      - description: CSV категорий
        in: query
        name: categories
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: from
        schema:
          type: string
      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: Страница (1-based)
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Размер страницы (1-100)
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      - description: Показывать родителей закрытых detail-requests
        in: query
        name: include_detailed
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
