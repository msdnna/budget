      - description: YYYY-MM-DD
        in: query
        name: to
        schema:
          type: string
      - description: YYYY-MM
        in: query
        name: month
        schema:
          type: string
      - description: YYYY
        in: query
        name: year
        schema:
          type: integer
      - description: income|expense|initial_balance
        in: query
        name: type
