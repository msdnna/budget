          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.LoginResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Unauthorized
      summary: Логин и выдача access + refresh JWT
