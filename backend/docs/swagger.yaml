components:
  schemas:
    handlers.CategoriesAllResponse:
      properties:
        expense:
          items:
            $ref: '#/components/schemas/models.Category'
          type: array
          uniqueItems: false
        income:
          items:
            $ref: '#/components/schemas/models.Category'
          type: array
          uniqueItems: false
        wishlist:
          items:
            $ref: '#/components/schemas/models.Category'
          type: array
          uniqueItems: false
      type: object
    handlers.CategoryLimitProgress:
      properties:
        category_id:
          type: string
        color:
          type: string
        icon:
          type: string
        limit:
          type: number
        name:
          type: string
        percent:
          type: number
        spent:
          type: number
      type: object
    handlers.LimitsProgressResponse:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/handlers.CategoryLimitProgress'
          type: array
          uniqueItems: false
        period:
          type: string
        total_limit:
          type: number
        total_percent:
          type: number
        total_spent:
          type: number
      type: object
    handlers.NotificationDTO:
      properties:
        category_id:
          type: string
        category_name:
          description: |-
            CategoryName / Limit / Spent snapshot the values at the moment of
            generation so historical notifications stay readable even after the
            category is renamed or its limit changes.
          type: string
        created_at:
          type: string
        id:
          type: string
        limit:
          type: number
        period:
          description: YYYY-MM
          type: string
        read:
          description: |-
            Read is a per-user view layer computed from ReadBy; clients render
            the badge state from this instead of having to scan the array.
          type: boolean
        read_by:
          items:
            type: string
          type: array
          uniqueItems: false
        spent:
          type: number
        type:
          $ref: '#/components/schemas/models.NotificationType'
      type: object
    handlers.NotificationsListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/handlers.NotificationDTO'
          type: array
          uniqueItems: false
        unread_count:
          type: integer
      type: object
    handlers.StatisticsOverviewResponse:
      properties:
        expenseByCategory:
          items:
            $ref: '#/components/schemas/models.CategoryData'
          type: array
          uniqueItems: false
        incomeByCategory:
          items:
            $ref: '#/components/schemas/models.CategoryData'
          type: array
          uniqueItems: false
        monthly:
          items:
            $ref: '#/components/schemas/models.MonthlyData'
          type: array
          uniqueItems: false
        summary:
          $ref: '#/components/schemas/models.SummaryData'
      type: object
    models.AdminUser:
      properties:
        avatar_url:
          type: string
        blocked_at:
          type: string
        created_at:
          type: string
        display_name:
          type: string
        id:
          type: string
        is_admin:
          type: boolean
        login:
          type: string
      type: object
    models.Category:
      properties:
        color:
          type: string
        created_at:
          type: string
        deleted_at:
          type: string
        icon:
          type: string
        icon_scale:
          description: |-
            IconScale lets the admin enlarge a category icon inside its colored
            badge (legend/lists). 0 (omitempty) = client uses default; 1.0 =
            default size; >1 = upscaled and clipped to badge shape; <1 = shrunk.
            Pie chart slice icons ignore this — they're sized for arc readability.
          type: number
        id:
          type: string
        is_default:
          type: boolean
        last_modified_by:
          $ref: '#/components/schemas/models.UserInfo'
        monthly_limit:
          description: |-
            MonthlyLimit caps spending for an expense category over the current
            calendar month (1st–end). Nil = no limit tracked. Only meaningful for
            section="expense"; ignored for income/wishlist.
          type: number
        name:
          type: string
        section:
          type: string
        updated_at:
          type: string
        version:
          type: integer
      type: object
    models.CategoryData:
      properties:
        amount:
          type: number
        category:
          type: string
        count:
          type: integer
        percentage:
          type: number
      type: object
    models.CategoryIcon:
      properties:
        id:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        uploaded_at:
          type: string
        uploaded_by:
          $ref: '#/components/schemas/models.UserInfo'
      type: object
    models.CategoryIconRef:
      properties:
        id:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        uploaded_at:
          type: string
        uploaded_by:
          $ref: '#/components/schemas/models.UserInfo'
      type: object
    models.ChangePasswordRequest:
      properties:
        new_password:
          type: string
        old_password:
          type: string
      required:
      - new_password
      - old_password
      type: object
    models.CreateCategoryRequest:
      properties:
        color:
          type: string
        icon:
          type: string
        name:
          type: string
        section:
          type: string
      required:
      - name
      - section
      type: object
    models.CreateDetailRequestPayload:
      properties:
        assignee_id:
          type: string
        transaction_id:
          type: string
      required:
      - assignee_id
      - transaction_id
      type: object
    models.CreateTransactionRequest:
      properties:
        amount:
          type: number
        category:
          type: string
        date:
          type: string
        description:
          type: string
        purpose:
          type: string
        source:
          type: string
        type:
          $ref: '#/components/schemas/models.TransactionType'
        wishlist_id:
          type: string
      required:
      - amount
      - category
      - date
      - type
      type: object
    models.CreateUserRequest:
      properties:
        display_name:
          type: string
        is_admin:
          type: boolean
        login:
          type: string
        password:
          type: string
      required:
      - display_name
      - login
      - password
      type: object
    models.CreateWishlistRequest:
      properties:
        category:
          type: string
        estimated_cost:
          type: number
        frequency:
          $ref: '#/components/schemas/models.Frequency'
        name:
          type: string
        notes:
          type: string
        priority:
          type: integer
        purchased:
          type: boolean
      required:
      - category
      - estimated_cost
      - name
      type: object
    models.DetailRequest:
      properties:
        assignee:
          $ref: '#/components/schemas/models.UserInfo'
        closed_at:
          type: string
        created_at:
          type: string
        creator:
          $ref: '#/components/schemas/models.UserInfo'
        id:
          type: string
        parent_transaction_id:
          type: string
        status:
          $ref: '#/components/schemas/models.DetailRequestStatus'
        target_amount:
          type: number
        updated_at:
          type: string
      type: object
    models.DetailRequestStatus:
      enum:
      - open
      - closed
      type: string
      x-enum-varnames:
      - DetailRequestOpen
      - DetailRequestClosed
    models.DetailRequestView:
      properties:
        children:
          items:
            $ref: '#/components/schemas/models.Transaction'
          type: array
          uniqueItems: false
        parent:
          $ref: '#/components/schemas/models.Transaction'
        request:
          $ref: '#/components/schemas/models.DetailRequest'
      type: object
    models.ForecastResponse:
      properties:
        breakdown:
          items:
            $ref: '#/components/schemas/models.CategoryData'
          type: array
          uniqueItems: false
        historical_avg:
          type: number
        regular_contrib:
          description: |-
            RegularContrib is the subset coming from recurring items only —
            clients use it to render two separate summary cards
            «Регулярные расходы / мес» (= regular_contrib) and
            «Список желаний / мес» (= wishlist_contrib − regular_contrib).
          type: number
        regular_items:
          items:
            $ref: '#/components/schemas/models.RegularItemForecast'
          type: array
          uniqueItems: false
        total_monthly:
          type: number
        unpurchased_wishlist:
          items:
            $ref: '#/components/schemas/models.WishlistItem'
          type: array
          uniqueItems: false
        wishlist_contrib:
          description: |-
            WishlistContrib is the SUM of contributions from all wishlist items
            (recurring + one-off). Kept for backward compat with older clients.
          type: number
      type: object
    models.Frequency:
      enum:
      - once
      - monthly
      - quarterly
      - yearly
      type: string
      x-enum-varnames:
      - FrequencyOnce
      - FrequencyMonthly
      - FrequencyQuarterly
      - FrequencyYearly
    models.LoginRequest:
      properties:
        login:
          type: string
        password:
          type: string
      required:
      - login
      - password
      type: object
    models.LoginResponse:
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        expires_at:
          type: string
        is_admin:
          type: boolean
        refresh_token:
          type: string
        token:
          type: string
        user_id:
          type: string
      type: object
    models.MonthlyData:
      properties:
        balance:
          type: number
        expense:
          type: number
        income:
          type: number
        initial_balance:
          type: number
        month:
          type: integer
        year:
          type: integer
      type: object
    models.NotificationType:
      enum:
      - category_limit_exceeded
      - global_limit_exceeded
      type: string
      x-enum-varnames:
      - NotificationCategoryLimitExceeded
      - NotificationGlobalLimitExceeded
    models.NullableFloat:
      properties:
        present:
          type: boolean
        valid:
          type: boolean
        value:
          type: number
      type: object
    models.RefreshRequest:
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
      type: object
    models.RefreshResponse:
      properties:
        expires_at:
          type: string
        refresh_token:
          type: string
        token:
          type: string
      type: object
    models.RegularItemForecast:
      properties:
        category:
          type: string
        estimated_cost:
          type: number
        frequency:
          type: string
        id:
          type: string
        monthly_cost:
          description: |-
            MonthlyCost is now the FULL cost per period (not divided across
            months) — clients display it with a frequency-specific suffix:
            monthly → "₽/мес", quarterly → "₽/кв", yearly → "₽/год".
          type: number
        name:
          type: string
        next_due_date:
          description: |-
            NextDueDate is when the item is next expected to be paid, derived
            from latest linked transaction + period (or "now" if never paid).
            Empty when not applicable. Forecast contribution = full
            estimated_cost when the item is monthly, OR NextDueDate ≤ now+1
            month — otherwise the recurring schedule is far enough out that
            it doesn't affect the upcoming month's projection.
          type: string
        notes:
          description: |-
            Notes mirrors the wishlist item's notes verbatim. Surfaced here so
            the «Оплачено» flow can prefill the expense form's «Описание»
            (description) without an extra wishlist lookup on the client.
          type: string
        paid_amount:
          type: number
        paid_count:
          type: integer
        paid_this_period:
          description: |-
            PaidThisPeriod is true when ≥1 linked expense exists in the current
            calendar period (month/quarter/year per frequency). Used by the UI
            for the "оплачено · X ₽" badge and strike-through styling.
          type: boolean
      type: object
    models.SetPasswordRequest:
      properties:
        password:
          type: string
      required:
      - password
      type: object
    models.SummaryData:
      properties:
        balance:
          type: number
        expense_count:
          type: integer
        income_count:
          type: integer
        initial_balance:
          type: number
        initial_balance_count:
          type: integer
        total_expense:
          type: number
        total_income:
          type: number
      type: object
    models.SyncEntityType:
      enum:
      - transaction
      - wishlist
      - category
      type: string
      x-enum-varnames:
      - SyncEntityTransaction
      - SyncEntityWishlist
      - SyncEntityCategory
    models.SyncOpStatus:
      enum:
      - ok
      - conflict
      - error
      type: string
      x-enum-varnames:
      - SyncStatusOK
      - SyncStatusConflict
      - SyncStatusError
    models.SyncOpType:
      enum:
      - create
      - update
      - delete
      type: string
      x-enum-varnames:
      - SyncOpCreate
      - SyncOpUpdate
      - SyncOpDelete
    models.SyncOperation:
      properties:
        base_version:
          type: integer
        entity:
          $ref: '#/components/schemas/models.SyncEntityType'
        force:
          type: boolean
        id:
          type: string
        op_id:
          type: string
        payload:
          items:
            type: integer
          type: array
          uniqueItems: false
        type:
          $ref: '#/components/schemas/models.SyncOpType'
      required:
      - entity
      - id
      - op_id
      - type
      type: object
    models.SyncOperationResult:
      properties:
        error:
          type: string
        op_id:
          type: string
        record:
          additionalProperties: {}
          type: object
        status:
          $ref: '#/components/schemas/models.SyncOpStatus'
      type: object
    models.SyncPullResponse:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/models.Category'
          type: array
          uniqueItems: false
        server_time:
          type: string
        transactions:
          items:
            $ref: '#/components/schemas/models.Transaction'
          type: array
          uniqueItems: false
        wishlist:
          items:
            $ref: '#/components/schemas/models.WishlistItem'
          type: array
          uniqueItems: false
      type: object
    models.SyncPushRequest:
      properties:
        operations:
          items:
            $ref: '#/components/schemas/models.SyncOperation'
          type: array
          uniqueItems: false
      required:
      - operations
      type: object
    models.SyncPushResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/models.SyncOperationResult'
          type: array
          uniqueItems: false
        server_time:
          type: string
      type: object
    models.Transaction:
      properties:
        amount:
          type: number
        category:
          type: string
        created_at:
          type: string
        created_by:
          $ref: '#/components/schemas/models.UserInfo'
        date:
          type: string
        deleted_at:
          type: string
        description:
          type: string
        detail_request_id:
          type: string
        detail_request_status:
          type: string
        excluded_from_stats:
          type: boolean
        hidden:
          type: boolean
        id:
          type: string
        last_modified_by:
          $ref: '#/components/schemas/models.UserInfo'
        parent_id:
          description: |-
            Detail-request linkage. ParentID is set on child transactions; it
            references the lump-sum parent. DetailRequestID/Status are set on the
            parent transaction once a detail-request is opened over it.
            ExcludedFromStats is denormalized so aggregation queries stay simple:
            while a request is open, children are excluded; once closed, the parent
            is excluded and the children become canonical.
          type: string
        purpose:
          type: string
        source:
          type: string
        type:
          $ref: '#/components/schemas/models.TransactionType'
        updated_at:
          type: string
        version:
          type: integer
        wishlist_id:
          description: |-
            WishlistID links an expense transaction to a recurring wishlist item.
            Empty when the transaction is not a recurring-payment fulfillment.
            Forecast aggregation uses it to decide whether a recurring item is
            "paid this period" and should be excluded from the projected total.
          type: string
      type: object
    models.TransactionType:
      enum:
      - income
      - expense
      - initial_balance
      type: string
      x-enum-varnames:
      - Income
      - Expense
      - InitialBalance
    models.UpdateCategoryRequest:
      properties:
        color:
          type: string
        icon:
          type: string
        icon_scale:
          type: number
        monthly_limit:
          $ref: '#/components/schemas/models.NullableFloat'
        name:
          type: string
      type: object
    models.UpdateTransactionRequest:
      properties:
        amount:
          type: number
        category:
          type: string
        created_by:
          $ref: '#/components/schemas/models.UserInfo'
        date:
          type: string
        description:
          type: string
        hidden:
          type: boolean
        purpose:
          type: string
        source:
          type: string
        wishlist_id:
          description: |-
            Pointer so an empty string ("") is distinguishable from absent — empty
            string unlinks the transaction from its wishlist item.
          type: string
      type: object
    models.UpdateUserRequest:
      properties:
        blocked:
          type: boolean
        display_name:
          type: string
        is_admin:
          type: boolean
        login:
          type: string
      type: object
    models.UpdateWishlistRequest:
      properties:
        category:
          type: string
        created_by:
          $ref: '#/components/schemas/models.UserInfo'
        estimated_cost:
          type: number
        frequency:
          $ref: '#/components/schemas/models.Frequency'
        name:
          type: string
        notes:
          type: string
        priority:
          type: integer
        purchased:
          type: boolean
      type: object
    models.UserInfo:
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        user_id:
          type: string
      type: object
    models.WishlistItem:
      properties:
        category:
          type: string
        created_at:
          type: string
        created_by:
          $ref: '#/components/schemas/models.UserInfo'
        deleted_at:
          type: string
        estimated_cost:
          type: number
        frequency:
          $ref: '#/components/schemas/models.Frequency'
        id:
          type: string
        last_modified_by:
          $ref: '#/components/schemas/models.UserInfo'
        name:
          type: string
        notes:
          type: string
        priority:
          type: integer
        purchased:
          type: boolean
        updated_at:
          type: string
        version:
          type: integer
      type: object
  securitySchemes:
    BearerAuth:
      description: Заголовок вида `Bearer <jwt>` (получить через `/auth/login`).
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    name: msdnna
    url: https://github.com/msdnna/budget
  description: 'REST API семейного бюджет-приложения (Go + MongoDB). JWT (Bearer)
    — защищённые ручки требуют заголовок `Authorization: Bearer <token>`, полученный
    через `POST /api/auth/login`.'
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: msdnna Budget API
  version: "1.0"
openapi: 3.1.0
paths:
  /admin/users:
    get:
      description: Возвращает login/is_admin/blocked_at/created_at в дополнение к
        публичным полям. Не-удалённые пользователи (включая заблокированных).
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/models.AdminUser'
                type: array
          description: OK
      security:
      - BearerAuth: []
      summary: Список пользователей с админ-полями (admin)
      tags:
      - users
    post:
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.CreateUserRequest'
                description: Тело
                summary: body
        description: Тело
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AdminUser'
          description: Created
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: login already taken
      security:
      - BearerAuth: []
      summary: Создать пользователя (admin)
      tags:
      - users
  /admin/users/{id}:
    delete:
      description: Помечает `deleted_at`. UserInfo-снимки в существующих записях остаются
        валидными. Нельзя удалить самого себя или последнего админа.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Soft-удалить пользователя (admin)
      tags:
      - users
    patch:
      description: 'Partial PATCH: login / display_name / is_admin / blocked. Safeguards:
        нельзя снять админку или заблокировать самого себя, нельзя снять админку с
        последнего админа.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.UpdateUserRequest'
                description: Тело
                summary: body
        description: Тело
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AdminUser'
          description: OK
        "400":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Conflict
      security:
      - BearerAuth: []
      summary: Обновить пользователя (admin)
      tags:
      - users
  /admin/users/{id}/avatar:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AdminUser'
          description: OK
      security:
      - BearerAuth: []
      summary: Удалить аватар (admin)
      tags:
      - users
    post:
      description: PNG / JPEG / SVG, до 512KB. Сохраняется inline в коллекции users.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              title: file
              type: file
          multipart/form-data:
            schema:
              type: object
        description: Файл
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.AdminUser'
          description: OK
      security:
      - BearerAuth: []
      summary: Загрузить аватар пользователя (admin)
      tags:
      - users
  /admin/users/{id}/password:
    post:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/models.SetPasswordRequest'
                description: Тело
                summary: body
        description: Тело
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
          description: OK
      security:
      - BearerAuth: []
      summary: Сменить пароль другого пользователя (admin)
      tags:
      - users
  /auth/login:
    post:
      description: Возвращает access (24ч) + refresh (30д). Refresh обменивается на
