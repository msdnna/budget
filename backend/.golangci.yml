version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - revive
    - misspell
    - unconvert
    - prealloc

  settings:
    errcheck:
      exclude-functions:
        - (*go.mongodb.org/mongo-driver/mongo.Cursor).Close
        - (*go.mongodb.org/mongo-driver/mongo.Client).Disconnect
        - (go.mongodb.org/mongo-driver/mongo.IndexView).CreateOne
        - (go.mongodb.org/mongo-driver/mongo.IndexView).CreateMany
        - (*github.com/xuri/excelize/v2.File).Close
        - (*github.com/xuri/excelize/v2.File).SetCellValue
        - (*github.com/xuri/excelize/v2.File).SetCellStyle
        - (*github.com/xuri/excelize/v2.File).SetRowStyle
        - (*github.com/xuri/excelize/v2.File).SetColWidth
        - (*github.com/xuri/excelize/v2.File).SetColStyle
        - (*github.com/xuri/excelize/v2.File).SetSheetName
        - (*github.com/xuri/excelize/v2.File).NewSheet
        - (*github.com/xuri/excelize/v2.File).SetActiveSheet
        - (*github.com/xuri/excelize/v2.File).MergeCell
        - (*github.com/xuri/excelize/v2.File).SetCellFormula
        - (*github.com/xuri/excelize/v2.File).SetSheetView
        - (*github.com/xuri/excelize/v2.File).DeleteSheet
        - (*github.com/xuri/excelize/v2.File).SetPanes
        - (*github.com/xuri/excelize/v2.File).AutoFilter
        - (net/http.ResponseWriter).Write
        - (*os.File).Close
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - commentFormatting

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gocritic
      # In tests `t *testing.T` is conventionally first; ctx comes after.
      - path: _test\.go
        text: "context-as-argument"
        linters:
          - revive
      - path: cmd/seed_loadtest/
        linters:
          - gocritic

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
