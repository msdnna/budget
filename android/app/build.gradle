plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'io.gitlab.arturbosch.detekt'
}

def appVersionName = rootProject.file("VERSION").text.trim()
def (vmaj, vmin, vpatch) = appVersionName.tokenize('.').collect { it.toInteger() }
def appVersionCode = vmaj * 10000 + vmin * 100 + vpatch

android {
    namespace 'website.msdnna.budget_app'
    compileSdk 37

    defaultConfig {
        applicationId "website.msdnna.budget_app"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_KEYSTORE_FILE") ?: ""
            if (ks) {
                storeFile     file(ks)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias      System.getenv("ANDROID_KEY_ALIAS")         ?: ""
                keyPassword   System.getenv("ANDROID_KEY_PASSWORD")      ?: ""
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            // Prefer the production keystore when the env vars are set;
            // fall back to the auto-generated debug keystore so an ad-hoc
            // `./gradlew assembleRelease` (e.g. perf testing) doesn't have
            // to set up signing. `make android-release` still requires the
            // real keystore env vars via build-android-release.sh.
            def hasReleaseKs = (System.getenv("ANDROID_KEYSTORE_FILE") ?: "").trim() != ""
            signingConfig hasReleaseKs ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        freeCompilerArgs.addAll(
            '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
            '-opt-in=androidx.compose.foundation.ExperimentalFoundationApi'
        )
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation "io.coil-kt:coil-compose:2.7.0"
}

// ktlint-gradle 13.x не цепляется к AGP 9.2 со встроенным Kotlin
// (нет KotlinAndroidExtension → нет source-set-задач). Поэтому подключаем
// ktlint CLI напрямую через отдельную конфигурацию + JavaExec.
configurations {
    ktlint
}

dependencies {
    ktlint("com.pinterest.ktlint:ktlint-cli:1.6.0") {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
    }
}

def ktlintSources = files("src/main/java", "src/test/java")

tasks.register("ktlintCheck", JavaExec) {
    group = "verification"
    description = "Run ktlint on all Kotlin sources"
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
    args(
        "**/src/main/java/**/*.kt",
        "**/src/test/java/**/*.kt",
        "--reporter=plain",
        "--reporter=checkstyle,output=${layout.buildDirectory.get().asFile}/reports/ktlint/ktlint.xml"
    )
    inputs.files(ktlintSources)
    inputs.file("${rootProject.projectDir}/.editorconfig")
    outputs.file("${layout.buildDirectory.get().asFile}/reports/ktlint/ktlint.xml")
}

tasks.register("ktlintFormat", JavaExec) {
    group = "verification"
    description = "Run ktlint formatter (rewrites files in place)"
    classpath = configurations.ktlint
    mainClass.set("com.pinterest.ktlint.Main")
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
    args(
        "-F",
        "**/src/main/java/**/*.kt",
        "**/src/test/java/**/*.kt"
    )
}

detekt {
    toolVersion = "1.23.8"
    config.setFrom(files("$projectDir/detekt.yml"))
    buildUponDefaultConfig = true
    autoCorrect = false
    parallel = true
    source.setFrom(files("src/main/java", "src/test/java"))
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "17"
    reports {
        html.required.set(true)
        xml.required.set(true)
        txt.required.set(false)
        sarif.required.set(false)
        md.required.set(false)
    }
}
